        const FormatUSAER_911_4 = ({ students, configGlobal, cycleConfig, activeCycleLabel }) => {
            const categories = {
                discapacidad: ['Ceguera', 'Baja visión', 'Sordera', 'Hipoacusia', 'Sordoceguera', 'Discapacidad motriz', 'Discapacidad intelectual', 'Discapacidad psicosocial', 'Discapacidad múltiple'],
                trastorno: ['Trastorno del espectro autista', 'Trastorno por déficit de atención e hiperactividad'],
                aptitudes: ['Aptitudes sobresalientes'],
                otras: ['Dificultad severa de conducta', 'Dificultad severa de comunicación', 'Dificultad severa de aprendizaje']
            };

            const stats = useMemo(() => {
                const db = { 1: { d:0, t:0, a:0, o:0 }, 2: { d:0, t:0, a:0, o:0 }, 3: { d:0, t:0, a:0, o:0 }, 4: { d:0, t:0, a:0, o:0 }, 5: { d:0, t:0, a:0, o:0 }, 6: { d:0, t:0, a:0, o:0 } };
                students.forEach(s => {
                    if (s.usaer !== 'Sí' || !s.condicionUsaer) return;
                    if (s.fechaBaja) return; 

                    const g = s.grado;
                    const c = s.condicionUsaer;
                    if (categories.discapacidad.includes(c)) db[g].d++;
                    else if (categories.trastorno.includes(c)) db[g].t++;
                    else if (categories.aptitudes.includes(c)) db[g].a++;
                    else if (categories.otras.includes(c)) db[g].o++;
                });
                return db;
            }, [students]);

            let totalD = 0, totalT = 0, totalA = 0, totalO = 0;

                    <div className="table-container rounded-2xl border border-slate-200 bg-white p-3 shadow-sm print:border-none print:p-0 print:shadow-none">
                        <table className="report-9113-table usaer-9114-table mx-auto mt-0 w-full max-w-5xl bg-white">
                            <thead>
                                <tr>

                                {GRADOS.map(g => {
                                    const { d, t, a, o } = stats[g];

        const Format911_4 = ({ students, configGlobal, cycleConfig, activeCycleLabel }) => {
            const report = useMemo(() => {
                const activeStudents = students.filter(student =>
                    student.estatus !== 'Baja' && !student.fechaBaja
                );
                const ageAtCutoff = student =>
                    calcularEdadCompleta(student.fechaNacimiento, cycleConfig.fechaCorte).anios;
                const conditionCategory = student => {
                    if (student.usaer !== 'Sí') return null;
                    const condition = student.condicionUsaer;
                    if (CONDICIONES_9114.discapacidad.includes(condition)) return 'discapacidad';
                    if (CONDICIONES_9114.trastorno.includes(condition)) return 'trastorno';
                    if (CONDICIONES_9114.aptitudes.includes(condition)) return 'aptitudes';
                    if (CONDICIONES_9114.otras.includes(condition)) return 'otras';
                    return null;
                };
                const byGrade = Object.fromEntries(GRADOS.map(grade => {
                    const roster = activeStudents.filter(student => Number(student.grado) === grade);
                    const sexH = roster.filter(student => student.sexo === 'H').length;
                    const sexM = roster.filter(student => student.sexo === 'M').length;
                    const categoryCount = category => roster.filter(student => conditionCategory(student) === category).length;
                    return [grade, {
                        hombres: sexH,
                        mujeres: sexM,
                        total: sexH + sexM,
                        grupos: new Set(roster.map(student => String(student.grupo || '').trim()).filter(Boolean)).size,
                        lenguaIndigena: roster.filter(student => student.hablaLenguaIndigena === 'Sí').length,
                        extranjero: roster.filter(student => student.extranjero === 'Sí').length,
                        afrodescendiente: roster.filter(student => student.afrodescendiente === 'Sí').length,
                        discapacidad: categoryCount('discapacidad'),
                        trastorno: categoryCount('trastorno'),
                        aptitudes: categoryCount('aptitudes'),
                        otras: categoryCount('otras')
                    }];
                }));
                const gradeTotals = Object.values(byGrade).reduce((total, grade) => {
                    Object.keys(total).forEach(key => { total[key] += grade[key]; });
                    return total;
                }, {
                    hombres: 0, mujeres: 0, total: 0, grupos: 0, lenguaIndigena: 0, extranjero: 0,
                    afrodescendiente: 0, discapacidad: 0, trastorno: 0, aptitudes: 0, otras: 0
                });

                const promotedSixth = { H: { 10: 0, 11: 0, 12: 0, 13: 0, 14: 0, 15: 0 }, M: { 10: 0, 11: 0, 12: 0, 13: 0, 14: 0, 15: 0 } };
                activeStudents.forEach(student => {
                    if (Number(student.grado) !== 6 || student.acreditacion !== 'Promovido') return;
                    if (student.sexo !== 'H' && student.sexo !== 'M') return;
                    const age = ageAtCutoff(student);
                    if (!age || age < 10) return;
                    promotedSixth[student.sexo][Math.min(age, 15)]++;
                });

                const scholarshipTypes = [...TIPOS_BECA_FEDERAL, ...TIPOS_BECA_ADICIONAL];
                const scholarshipByType = Object.fromEntries(scholarshipTypes.map(type => [
                    type,
                    { H: 0, M: 0, total: 0 }
                ]));
                activeStudents.forEach(student => {
                    if (student.beca !== 'Sí' || !scholarshipByType[student.tipoBeca]) return;
                    const row = scholarshipByType[student.tipoBeca];
                    if (student.sexo === 'H' || student.sexo === 'M') {
                        row[student.sexo]++;
                        row.total++;
                    }
                });

                const scholarshipStatus = ['Con beca', 'Sin beca'].map(label => {
                    const hasScholarship = label === 'Con beca';
                    const roster = activeStudents.filter(student => (student.beca === 'Sí') === hasScholarship);
                    const count = predicate => roster.filter(predicate).length;
                    return {
                        label,
                        hombres: count(student => student.sexo === 'H'),
                        mujeres: count(student => student.sexo === 'M'),
                        total: roster.length,
                        discapacidad: count(student => conditionCategory(student) === 'discapacidad'),
                        lenguaIndigena: count(student => student.hablaLenguaIndigena === 'Sí'),
                        extranjero: count(student => student.extranjero === 'Sí')
                    };
                });
                const scholarshipStatusTotals = scholarshipStatus.reduce((total, row) => ({
                    hombres: total.hombres + row.hombres,
                    mujeres: total.mujeres + row.mujeres,
                    total: total.total + row.total,
                    discapacidad: total.discapacidad + row.discapacidad,
                    lenguaIndigena: total.lenguaIndigena + row.lenguaIndigena,
                    extranjero: total.extranjero + row.extranjero
                }), { hombres: 0, mujeres: 0, total: 0, discapacidad: 0, lenguaIndigena: 0, extranjero: 0 });

                return { activeCount: activeStudents.length, byGrade, gradeTotals, promotedSixth, scholarshipByType, scholarshipStatus, scholarshipStatusTotals };
            }, [students, cycleConfig.fechaCorte]);

            const ageLabels = ['10 años', '11 años', '12 años', '13 años', '14 años', '15 años y más'];
            const ages = [10, 11, 12, 13, 14, 15];
            const totalPromotedBySex = sex => ages.reduce((total, age) => total + report.promotedSixth[sex][age], 0);
            const scholarshipTypeTotals = types => types.reduce((sum, type) => ({
                H: sum.H + report.scholarshipByType[type].H,
                M: sum.M + report.scholarshipByType[type].M,
                total: sum.total + report.scholarshipByType[type].total
            }), { H: 0, M: 0, total: 0 });
            const federalTotals = scholarshipTypeTotals(TIPOS_BECA_FEDERAL);
            const otherScholarshipTotals = scholarshipTypeTotals(TIPOS_BECA_ADICIONAL);
            const overallScholarshipTotals = scholarshipTypeTotals([...TIPOS_BECA_FEDERAL, ...TIPOS_BECA_ADICIONAL]);
            const tableClass = 'w-full min-w-[1050px] border-collapse text-xs text-slate-800';
            const headerClass = 'border border-slate-300 bg-slate-100 px-2 py-3 text-center font-bold align-middle';

            return (

                            <span className="ml-2 font-bold">Alumnos activos considerados: {report.activeCount}.</span>
                        </div>

                        <section aria-labelledby="report-9114-existence" className="space-y-3">
                            <div>
                                <h2 id="report-9114-existence" className="text-lg font-extrabold text-emerald-900">I. Existencia y promovidos</h2>
                                <p className="text-sm text-slate-600">Existencia actual del padrón, desglosada por grado, sexo y características.</p>
                            </div>
                            <div className="table-container overflow-x-auto rounded-xl border border-slate-300 bg-white shadow-sm">
                                <table className={tableClass}>
                                    <thead><tr>
                                        {['Grado', 'Hombres', 'Mujeres', 'Total', 'Grupos por grado', 'Hablantes de lengua indígena', 'Nacidos fuera de México', 'Afrodescendientes', 'Con discapacidad', 'Con trastorno/neurodivergencia', 'Aptitudes sobresalientes', 'Otras condiciones'].map(label =>
                                            <th key={label} className={headerClass}>{label}</th>
                                        )}
                                    </tr></thead>
                                    <tbody>
                                        {GRADOS.map(grade => {
                                            const row = report.byGrade[grade];
                                            return (
                                                <tr key={grade} className="even:bg-slate-50">
                                                    <th scope="row" className={`${cellClass} font-bold`}>{grade}°</th>
                                                    {[row.hombres, row.mujeres, row.total, row.grupos, row.lenguaIndigena, row.extranjero, row.afrodescendiente, row.discapacidad, row.trastorno, row.aptitudes, row.otras].map((value, index) =>
                                                        <td key={index} className={cellClass}>{value}</td>
                                                    )}
                                                </tr>
                                            );
                                        })}
                                        <tr className="bg-slate-50">
                                            <th scope="row" className={`${cellClass} font-bold`}>Más de un grado</th>
                                            <td colSpan="3" className={`${cellClass} text-slate-400`}>—</td>
                                            <td className={`${cellClass} text-slate-400`} title="No se captura información de grupos multigrado en el padrón">—</td>
                                            <td colSpan="7" className={`${cellClass} text-left text-slate-500`}>El padrón registra a cada alumno en un solo grado y no captura grupos multigrado.</td>
                                        </tr>
                                    </tbody>
                                    <tfoot><tr>
                                        <th scope="row" className={totalCellClass}>Total</th>
                                        {[report.gradeTotals.hombres, report.gradeTotals.mujeres, report.gradeTotals.total, report.gradeTotals.grupos, report.gradeTotals.lenguaIndigena, report.gradeTotals.extranjero, report.gradeTotals.afrodescendiente, report.gradeTotals.discapacidad, report.gradeTotals.trastorno, report.gradeTotals.aptitudes, report.gradeTotals.otras].map((value, index) =>
                                            <td key={index} className={totalCellClass}>{value}</td>
                                        )}
                                    </tr></tfoot>
                                </table>
                            </div>
                        </section>

                        <section aria-labelledby="report-9114-promoted" className="space-y-3">
                            <div>
                                <h2 id="report-9114-promoted" className="text-lg font-extrabold text-emerald-900">3. Alumnado promovido de sexto grado por sexo y edad</h2>
                                <p className="text-sm text-slate-600">Se consideran alumnos activos de 6° con acreditación “Promovido”; la edad se calcula a la fecha de corte del ciclo.</p>
                            </div>
                            <div className="table-container overflow-x-auto rounded-xl border border-slate-300 bg-white shadow-sm">
                                <table className="w-full min-w-[760px] border-collapse text-sm text-slate-800">
                                    <thead><tr>
                                        <th className={headerClass}>Sexo</th>
                                        {ageLabels.map(label => <th key={label} className={headerClass}>{label}</th>)}
                                        <th className={headerClass}>Total</th>
                                    </tr></thead>
                                    <tbody>
                                        {['H', 'M'].map((sex, index) => (
                                            <tr key={sex} className={index ? 'bg-slate-50' : ''}>
                                                <th scope="row" className={`${cellClass} font-bold`}>{sex === 'H' ? 'Hombres' : 'Mujeres'}</th>
                                                {ages.map(age => <td key={age} className={cellClass}>{report.promotedSixth[sex][age]}</td>)}
                                                <td className={totalCellClass}>{totalPromotedBySex(sex)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot><tr>
                                        <th scope="row" className={totalCellClass}>Total</th>
                                        {ages.map(age => <td key={age} className={totalCellClass}>{report.promotedSixth.H[age] + report.promotedSixth.M[age]}</td>)}
                                        <td className={totalCellClass}>{totalPromotedBySex('H') + totalPromotedBySex('M')}</td>
                                    </tr></tfoot>
                                </table>

                        <section aria-labelledby="report-9114-scholarships" className="space-y-3">
                            <div>
                                <h2 id="report-9114-scholarships" className="text-lg font-extrabold text-emerald-900">III. Becas</h2>
                                <p className="text-sm text-slate-600">Concentrado por sexo y características; para cada alumno se cuenta el tipo de beca registrado en el padrón.</p>
                            </div>
                            <div className="table-container overflow-x-auto rounded-xl border border-slate-300 bg-white shadow-sm">
                                <table className="w-full min-w-[900px] border-collapse text-sm text-slate-800">
                                    <thead><tr>
                                        {['Condición', 'Hombres', 'Mujeres', 'Total', 'Con discapacidad', 'Hablantes de lengua indígena', 'Nacidos fuera de México'].map(label =>
                                            <th key={label} className={headerClass}>{label}</th>
                                        )}
                                    </tr></thead>
                                    <tbody>
                                        {report.scholarshipStatus.map((row, index) => (
                                            <tr key={row.label} className={index ? 'bg-slate-50' : ''}>
                                                <th scope="row" className={`${cellClass} text-left font-bold`}>{row.label}</th>
                                                {[row.hombres, row.mujeres, row.total, row.discapacidad, row.lenguaIndigena, row.extranjero].map((value, cellIndex) =>
                                                    <td key={cellIndex} className={cellClass}>{value}</td>
                                                )}
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot><tr>
                                        <th scope="row" className={`${totalCellClass} text-left`}>Total escolar</th>
                                        {[report.scholarshipStatusTotals.hombres, report.scholarshipStatusTotals.mujeres, report.scholarshipStatusTotals.total, report.scholarshipStatusTotals.discapacidad, report.scholarshipStatusTotals.lenguaIndigena, report.scholarshipStatusTotals.extranjero].map((value, index) =>
                                            <td key={index} className={totalCellClass}>{value}</td>
                                        )}
                                    </tr></tfoot>
                                </table>
                            </div>
                            <div className="table-container overflow-x-auto rounded-xl border border-slate-300 bg-white shadow-sm">
                                <table className="w-full min-w-[760px] border-collapse text-sm text-slate-800">
                                    <thead><tr>
                                        <th className={headerClass}>Origen / tipo de beca</th>
                                        <th className={headerClass}>Hombres</th>
                                        <th className={headerClass}>Mujeres</th>
                                        <th className={headerClass}>Total</th>
                                    </tr></thead>
                                    <tbody>
                                        <tr className="bg-emerald-50"><th colSpan="4" className="border border-slate-300 px-3 py-2 text-left font-extrabold">Becas federales</th></tr>
                                        {TIPOS_BECA_FEDERAL.map(type => (
                                            <tr key={type}>
                                                <th scope="row" className={`${cellClass} text-left`}>{type}{type === 'Otra' ? '*' : ''}{type === 'Otra' && <span className="block text-xs text-slate-500">Especifique: se registra en el padrón</span>}</th>
                                                <td className={cellClass}>{report.scholarshipByType[type].H}</td>
                                                <td className={cellClass}>{report.scholarshipByType[type].M}</td>
                                                <td className={cellClass}>{report.scholarshipByType[type].total}</td>
                                            </tr>
                                        ))}
                                        <tr className="bg-amber-50 font-bold">
                                            <th className={`${cellClass} text-left`}>Total becas federales</th>
                                            <td className={totalCellClass}>{federalTotals.H}</td><td className={totalCellClass}>{federalTotals.M}</td><td className={totalCellClass}>{federalTotals.total}</td>
                                        </tr>
                                        <tr className="bg-emerald-50"><th colSpan="4" className="border border-slate-300 px-3 py-2 text-left font-extrabold">Otras becas</th></tr>
                                        {TIPOS_BECA_ADICIONAL.map(type => (
                                            <tr key={type}>
                                                <th scope="row" className={`${cellClass} text-left`}>{type}{type === 'Otras' ? '*' : ''}{type === 'Otras' && <span className="block text-xs text-slate-500">Especifique: se registra en el padrón</span>}</th>
                                                <td className={cellClass}>{report.scholarshipByType[type].H}</td>
                                                <td className={cellClass}>{report.scholarshipByType[type].M}</td>
                                                <td className={cellClass}>{report.scholarshipByType[type].total}</td>
                                            </tr>
                                        ))}
                                        <tr className="bg-amber-50 font-bold">
                                            <th className={`${cellClass} text-left`}>Total otras becas</th>
                                            <td className={totalCellClass}>{otherScholarshipTotals.H}</td><td className={totalCellClass}>{otherScholarshipTotals.M}</td><td className={totalCellClass}>{otherScholarshipTotals.total}</td>
                                        </tr>
                                    </tbody>
                                    <tfoot><tr>
                                        <th scope="row" className={`${totalCellClass} text-left`}>Total de becas</th>
                                        <td className={totalCellClass}>{overallScholarshipTotals.H}</td>
                                        <td className={totalCellClass}>{overallScholarshipTotals.M}</td>
                                        <td className={totalCellClass}>{overallScholarshipTotals.total}</td>
                                    </tr></tfoot>
                                </table>
                            </div>
                            <p className="text-xs text-slate-500">* El detalle especificado se conserva en la ficha del alumno.</p>
                        </section>
                    </div>
                    <PrintFooter configGlobal={configGlobal} cycleConfig={cycleConfig} />
                </div>
            );
        };

            <button

                className={`flex shrink-0 items-center gap-3 rounded-xl text-sm font-semibold transition-colors ${

                }`}
            >
                <span className={active ? 'text-white' : 'text-slate-400'}>{icon}</span>
                {children}
            </button>
        );

        const GlobalStudentSearch = ({ cycles, searchTerm, onSearchTermChange, onEditStudent }) => {
            const query = searchTerm.trim().toLocaleLowerCase();
            const results = cycles.flatMap(cycle =>
                (cycle.students || []).map(student => ({ cycle, student }))
            ).filter(({ cycle, student }) => {
                if (!query) return false;
                const course = typeof student.curso === 'string'
                    ? student.curso
                    : student.curso?.nombre || student.course || student.programa || student.nombreCurso || '';
                const searchableText = [
                    student.paterno,
                    student.materno,
                    student.nombres,
                    student.nombre,
                    student.curp,
                    student.usuario,
                    student.correo,
                    student.email,
                    student.correoElectronico,
                    student.telefono,
                    student.phone,
                    student.phoneNumber,
                    student.celular,
                    student.telefonoContacto,
                    student.contacto,
                    student.grupo,
                    student.grado,
                    `${student.grado || ''}° ${student.grupo || ''}`,
                    course,
                    cycle.label
                ].filter(Boolean).join(' ').toLocaleLowerCase();
                return searchableText.includes(query);
            });

            return (
                <div className="h-full overflow-y-auto">

                            </div>
                            <span className="w-fit rounded-full bg-emerald-50 px-3 py-1.5 text-sm font-bold text-emerald-800">
                                {results.length} {results.length === 1 ? 'resultado' : 'resultados'}
                            </span>
                        </div>
                        <div className="border-b border-emerald-100 bg-emerald-50 px-5 py-5">
                            <label htmlFor="global-student-search" className="mb-2 block text-xs font-extrabold uppercase tracking-wide text-emerald-900">

                        </div>
                        <div className="overflow-x-auto p-5">
                            {!query ? (
                                <p className="rounded-xl bg-slate-50 px-4 py-8 text-center text-sm text-slate-500">Escribe un dato para buscar alumnos en todos los ciclos escolares.</p>
                            ) : results.length === 0 ? (
                                <p className="rounded-xl bg-slate-50 px-4 py-8 text-center text-sm text-slate-500">No se encontraron alumnos con ese dato.</p>
                            ) : (
                                <table className="w-full min-w-[900px] border-collapse text-left text-sm">
                                    <thead>
                                        <tr className="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
                                            <th className="px-3 py-3 font-bold">Alumno</th>
                                            <th className="px-3 py-3 font-bold">CURP / Contacto</th>
                                            <th className="px-3 py-3 font-bold">Ciclo</th>
                                            <th className="px-3 py-3 text-center font-bold">Grado / Grupo</th>
                                            <th className="px-3 py-3 text-center font-bold">Estatus</th>
                                            <th className="px-3 py-3 text-center font-bold">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {results.map(({ cycle, student }) => {
                                            const course = typeof student.curso === 'string'
                                                ? student.curso
                                                : student.curso?.nombre || student.course || student.programa || student.nombreCurso || '';
                                            const contact = [
                                                student.correo || student.email || student.correoElectronico,
                                                student.telefono || student.phone || student.phoneNumber || student.celular || student.telefonoContacto || student.contacto
                                            ]
                                                .filter(Boolean);
                                            return (
                                                <tr key={`${cycle.id}-${student.id}`} className="border-t border-slate-100 align-top hover:bg-slate-50">
                                                    <td className="px-3 py-4">
                                                        <div className="font-bold text-slate-800">{`${student.paterno || ''} ${student.materno || ''}`.trim()}</div>
                                                        <div className="text-slate-700">{student.nombres || student.nombre || ''}</div>
                                                        {course && <div className="mt-1 text-xs text-slate-500">{course}</div>}
                                                    </td>
                                                    <td className="px-3 py-4 text-slate-600">
                                                        <div className="font-mono text-xs">{student.curp || '—'}</div>
                                                        {contact.map(value => <div key={value} className="mt-1 text-xs">{value}</div>)}
                                                    </td>
                                                    <td className="px-3 py-4 text-slate-700">{cycle.label || '—'}</td>
                                                    <td className="px-3 py-4 text-center font-medium text-slate-700">{student.grado ? `${student.grado}° ` : ''}{student.grupo || '—'}</td>
                                                    <td className="px-3 py-4 text-center">
                                                        <span className={`rounded-full px-2.5 py-1 text-xs font-bold ${student.estatus === 'Baja' ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700'}`}>
                                                            {student.estatus || 'Activo'}
                                                        </span>
                                                    </td>
                                                    <td className="px-3 py-4 text-center">
                                                        <button
                                                            type="button"
                                                            onClick={() => onEditStudent(cycle, student)}
                                                            className="inline-flex items-center gap-1.5 rounded-lg bg-emerald-600 px-3 py-2 font-bold text-white transition-colors hover:bg-emerald-700"
                                                        >
                                                            <Icons.Edit /> Editar
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </section>
                </div>
            );
        };

        const SpecialEducationConditionList = ({ students, fechaCorte, activeCycleLabel, schoolConfig }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [isExportMenuOpen, setIsExportMenuOpen] = useState(false);
            const [exportHost, setExportHost] = useState(null);
            useEffect(() => {
                setExportHost(document.getElementById('ee-condition-export-slot'));
            }, []);
            const conditionColumns = [
                { key: 'Discapacidad intelectual', label: 'Discap. intelectual', headerClass: 'bg-emerald-200' },
                { key: 'Discapacidad motriz', label: 'Discap. motriz', headerClass: 'bg-emerald-200' },
                { key: 'Sordera', label: 'Auditiva: sordera', headerClass: 'bg-emerald-200' },
                { key: 'Hipoacusia', label: 'Auditiva: hipoacusia', headerClass: 'bg-emerald-200' },
                { key: 'Ceguera', label: 'Visual: ceguera', headerClass: 'bg-emerald-200' },
                { key: 'Baja visión', label: 'Visual: baja visión', headerClass: 'bg-emerald-200' },
                { key: 'Discapacidad múltiple', label: 'Discap. múltiple', headerClass: 'bg-emerald-200' },
                { key: 'Sordoceguera', label: 'Sordoceguera', headerClass: 'bg-emerald-200' },
                { key: 'Discapacidad psicosocial', label: 'Mental o psicosocial', headerClass: 'bg-emerald-200' },
                { key: 'Dificultad severa de conducta', label: 'Dificultad severa de conducta', headerClass: 'bg-sky-500 text-white' },
                { key: 'Dificultad severa de comunicación', label: 'Problemas de comunicación', headerClass: 'bg-sky-500 text-white' },
                { key: 'Dificultad severa de aprendizaje', label: 'Problemas de aprendizaje', headerClass: 'bg-sky-500 text-white' },
                { key: 'Trastorno del espectro autista', label: 'Trastorno del espectro autista', headerClass: 'bg-sky-500 text-white' },
                { key: 'Trastorno por déficit de atención e hiperactividad', label: 'TDAH', headerClass: 'bg-sky-500 text-white' },
                { key: 'Aptitudes sobresalientes', label: 'Específico*', headerClass: 'bg-sky-500 text-white' }
            ];
            const studentsWithCondition = useMemo(() => {
                const uniqueStudents = new Map();
                students
                    .filter(student => student.estatus !== 'Baja' && student.usaer === 'Sí' && student.condicionUsaer)
                    .forEach(student => {
                        const curp = String(student.curp || '').trim().toUpperCase();
                        const key = curp || `id:${student.id}`;
                        if (!uniqueStudents.has(key)) uniqueStudents.set(key, student);
                    });
                return Array.from(uniqueStudents.values()).sort((a, b) =>
                    Number(a.grado) - Number(b.grado)
                    || String(a.grupo || '').localeCompare(String(b.grupo || ''))
                    || String(a.paterno || '').localeCompare(String(b.paterno || ''))
                    || String(a.nombres || '').localeCompare(String(b.nombres || ''))
                );
            }, [students]);
            const filteredStudents = useMemo(() => {
                const term = searchTerm.trim().toLocaleLowerCase();
                if (!term) return studentsWithCondition;
                return studentsWithCondition.filter(student =>
                    `${student.paterno || ''} ${student.materno || ''} ${student.nombres || ''} ${student.curp || ''}`
                        .toLocaleLowerCase()
                        .includes(term)
                );
            }, [studentsWithCondition, searchTerm]);
            const totalForColumn = key => filteredStudents.filter(student => student.condicionUsaer === key).length;
            const totalForAptitude = aptitude => filteredStudents.filter(student =>
                student.condicionUsaer === 'Aptitudes sobresalientes'
                && student.subcondicionAptitudes === aptitude
            ).length;
            const totalStudents = filteredStudents.length;

            const formatBirthDate = value => {
                if (!value) return '—';
                const parts = String(value).split('-');
                return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : value;
            };

            const getExportRows = () => filteredStudents.map((student, index) => [
                index + 1,
                `${student.paterno || ''} ${student.materno || ''}*${student.nombres || ''}`.trim(),
                student.curp || '',
                formatBirthDate(student.fechaNacimiento),
                `${student.grado}° ${student.grupo}`,
                student.sexo || '',
                calcularEdadCompleta(student.fechaNacimiento, fechaCorte).anios,
                ...conditionColumns.map(column => student.condicionUsaer === column.key ? 1 : ''),
                ...APTITUDES_TIPOS.map(aptitude =>
                    student.condicionUsaer === 'Aptitudes sobresalientes' && student.subcondicionAptitudes === aptitude ? 1 : ''
                )
            ]);
            const getExportFooterRows = () => {
                const columnTotals = [
                    ...conditionColumns.map(column => totalForColumn(column.key)),
                    ...APTITUDES_TIPOS.map(totalForAptitude)
                ];
                const subtotal = [...Array(6).fill(''), 'Subtotal', ...columnTotals];
                const total = [...Array(25).fill(''), 'Total', totalStudents];
                return { subtotal, total };
            };

            const exportToExcel = () => {
                if (!window.XLSX) {
                    window.alert('No se pudo cargar la herramienta de exportación a Excel. Verifica tu conexión e inténtalo de nuevo.');
                    return;
                }
                try {
                    const workbook = window.XLSX.utils.book_new();
                    const fixedHeaders = ['No.', 'Nombre del alumno', 'CURP', 'Fecha de nacimiento', 'Grado / Grupo', 'Sexo', 'Años'];
                    const headers = [
                        ...fixedHeaders,
                        ...conditionColumns.map(column => column.label),
                        ...APTITUDES_TIPOS
                    ];
                    const { subtotal, total } = getExportFooterRows();
                    const sheet = window.XLSX.utils.aoa_to_sheet([
                        ['LISTADO DE ALUMNOS DE EDUCACIÓN ESPECIAL POR CONDICIÓN'],
                        [`Escuela: ${schoolConfig?.nombre || 'Escuela'}`],
                        [`C.C.T.: ${schoolConfig?.cct || 'Sin clave'}    |    Ciclo escolar: ${activeCycleLabel || 'Sin ciclo'}`],
                        headers,
                        ...getExportRows(),
                        subtotal,
                        total
                    ]);
                    const tableHeaderRow = 3;
                    const subtotalRow = tableHeaderRow + filteredStudents.length + 1;
                    const totalRow = subtotalRow + 1;
                    const border = {
                        top: { style: 'thin', color: { rgb: 'CBD5E1' } },
                        bottom: { style: 'thin', color: { rgb: 'CBD5E1' } },
                        left: { style: 'thin', color: { rgb: 'CBD5E1' } },
                        right: { style: 'thin', color: { rgb: 'CBD5E1' } }
                    };
                    const range = window.XLSX.utils.decode_range(sheet['!ref']);
                    for (let row = 0; row <= range.e.r; row++) {
                        for (let column = 0; column <= range.e.c; column++) {
                            const address = window.XLSX.utils.encode_cell({ r: row, c: column });
                            if (!sheet[address]) continue;
                            const isFooter = row === subtotalRow || row === totalRow;
                            const isGroupedLabel = row === subtotalRow && column === 6;
                            sheet[address].s = {
                                font: { name: 'Arial', sz: row === 0 ? 14 : row === tableHeaderRow ? 9 : 8, bold: row === 0 || row === tableHeaderRow || isFooter, color: { rgb: row === 0 ? '065F46' : '1E293B' } },
                                alignment: { horizontal: row < tableHeaderRow ? 'center' : column < 2 || isGroupedLabel ? 'left' : 'center', vertical: 'center', wrapText: true },
                                ...(row >= tableHeaderRow ? { border } : {}),
                                ...(row === tableHeaderRow ? { fill: { patternType: 'solid', fgColor: { rgb: 'DCE6F1' } } } : {}),
                                ...(row === subtotalRow ? { fill: { patternType: 'solid', fgColor: { rgb: 'ECFDF5' } } } : {}),
                                ...(row === totalRow ? { fill: { patternType: 'solid', fgColor: { rgb: 'FEF3C7' } } } : {})
                            };
                        }
                    }
                    sheet['!merges'] = [0, 1, 2].map(row => ({
                        s: { r: row, c: 0 },
                        e: { r: row, c: headers.length - 1 }
                    }));
                    sheet['!cols'] = [
                        { wch: 6 }, { wch: 32 }, { wch: 22 }, { wch: 16 }, { wch: 14 }, { wch: 8 }, { wch: 7 },
                        ...conditionColumns.map(() => ({ wch: 13 })),
                        ...APTITUDES_TIPOS.map(() => ({ wch: 13 }))
                    ];
                    sheet['!rows'] = [{ hpt: 28 }, { hpt: 22 }, { hpt: 22 }, { hpt: 48 }, ...Array.from({ length: filteredStudents.length + 2 }, () => ({ hpt: 22 }))];
                    window.XLSX.utils.book_append_sheet(workbook, sheet, 'Listado por condición');
                    const safeCycle = (activeCycleLabel || 'ciclo').replace(/[^a-zA-Z0-9_-]+/g, '_');
                    window.XLSX.writeFile(workbook, `Listado_EE_por_Condicion_${safeCycle}.xlsx`);
                } catch (error) {
                    console.error('No se pudo exportar el listado por condición a Excel:', error);
                    window.alert(`No se pudo exportar a Excel: ${error.message}`);
                }
            };

            const exportToPDF = () => {
                const JsPDF = window.jspdf?.jsPDF;
                if (!JsPDF) {
                    window.alert('No se pudo cargar la herramienta de exportación a PDF. Verifica tu conexión e inténtalo de nuevo.');
                    return;
                }
                try {
                    const pdf = new JsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });
                    const pageWidth = 279.4;
                    const pageHeight = 215.9;
                    const logo = document.querySelector('header img[alt="Primaria José María Martínez Rodríguez"]');
                    if (!logo?.src) throw new Error('No se encontró la imagen del encabezado para incluirla en el PDF.');
                    const logoDimensions = JsPDF.API.getImageProperties(logo.src);
                    const logoScale = Math.min(38 / logoDimensions.width, 12 / logoDimensions.height);
                    const drawHeader = () => {
                        pdf.addImage(logo.src, 'PNG', 7, 4, logoDimensions.width * logoScale, logoDimensions.height * logoScale);
                        pdf.setFont('helvetica', 'bold');
                        pdf.setFontSize(10);
                        pdf.setTextColor(6, 95, 70);
                        pdf.text('LISTADO DE ALUMNOS DE EDUCACIÓN ESPECIAL POR CONDICIÓN', pageWidth / 2, 10, { align: 'center', maxWidth: pageWidth - 55 });
                        pdf.setFont('helvetica', 'normal');
                        pdf.setFontSize(7);
                        pdf.setTextColor(51, 65, 85);
                        pdf.text(`Escuela: ${schoolConfig?.nombre || 'Escuela'}`, 7, 19);
                        pdf.text(`C.C.T.: ${schoolConfig?.cct || 'Sin clave'}`, 7, 24);
                        pdf.text(`Ciclo escolar: ${activeCycleLabel || 'Sin ciclo'}`, pageWidth - 7, 24, { align: 'right' });
                        pdf.setDrawColor(167, 243, 208);
                        pdf.setLineWidth(0.5);
                        pdf.line(7, 28, pageWidth - 7, 28);
                    };
                    const header = [
                        'No.', 'Nombre del alumno', 'CURP', 'Fecha nac.', 'Grado/Grupo', 'Sexo', 'Años',
                        ...conditionColumns.map(column => column.label),
                        ...APTITUDES_TIPOS
                    ];
                    const { subtotal, total } = getExportFooterRows();
                    const totalRow = [...Array(25).fill(''), 'Total', totalStudents];
                    const rows = [
                        ...getExportRows(),
                        subtotal,
                        totalRow
                    ];
                    const conditionColumnWidths = conditionColumns.map(() => 5);
                    const aptitudeColumnWidths = APTITUDES_TIPOS.map(() => 7);
                    pdf.autoTable({
                        head: [header],
                        body: rows,
                        startY: 32,
                        theme: 'grid',
                        styles: { font: 'helvetica', fontSize: 4.2, textColor: [30, 41, 59], cellPadding: 0.7, lineColor: [203, 213, 225], lineWidth: 0.2, valign: 'middle', overflow: 'linebreak' },
                        headStyles: { fillColor: [226, 232, 240], textColor: [15, 23, 42], fontStyle: 'bold', fontSize: 4.2 },
                        columnStyles: {
                            0: { cellWidth: 7, halign: 'center' },
                            1: { cellWidth: 36 },
                            2: { cellWidth: 31 },
                            3: { cellWidth: 17, halign: 'center' },
                            4: { cellWidth: 16, halign: 'center' },
                            5: { cellWidth: 8, halign: 'center' },
                            6: { cellWidth: 8, halign: 'center' },
                            ...Object.fromEntries(conditionColumnWidths.map((cellWidth, index) => [7 + index, { cellWidth, halign: 'center' }])),
                            ...Object.fromEntries(aptitudeColumnWidths.map((cellWidth, index) => [7 + conditionColumns.length + index, { cellWidth, halign: 'center' }]))
                        },
                        margin: { top: 32, right: 7, bottom: 12, left: 7 },
                        didParseCell: data => {
                            const footerIndex = data.row.index - filteredStudents.length;
                            if (data.section === 'body' && footerIndex === 0) {
                                data.cell.styles.fillColor = [236, 253, 245];
                                data.cell.styles.fontStyle = 'bold';
                            } else if (data.section === 'body' && footerIndex === 1) {
                                data.cell.styles.fillColor = [254, 243, 199];
                                data.cell.styles.fontStyle = 'bold';
                            }
                        },
                        didDrawPage: () => {
                            drawHeader();
                            pdf.setFont('helvetica', 'normal');
                            pdf.setFontSize(7);
                            pdf.setTextColor(100, 116, 139);
                            pdf.text(`Página ${pdf.getNumberOfPages()}`, pageWidth - 7, pageHeight - 5, { align: 'right' });
                        }
                    });
                    const safeCycle = (activeCycleLabel || 'ciclo').replace(/[^a-zA-Z0-9_-]+/g, '_');
                    pdf.save(`Listado_EE_por_Condicion_${safeCycle}.pdf`);
                } catch (error) {
                    console.error('No se pudo exportar el listado por condición a PDF:', error);
                    window.alert(`No se pudo exportar a PDF: ${error.message}`);
                }
            };

            return (
                <>
                    {exportHost && ReactDOM.createPortal(
                        <div className="relative">
                            <button
                                type="button"
                                aria-haspopup="menu"
                                aria-expanded={isExportMenuOpen}
                                onClick={() => setIsExportMenuOpen(open => !open)}
                                className="flex items-center gap-2 rounded-xl border border-indigo-200 bg-white px-4 py-2.5 text-sm font-bold text-indigo-700 shadow-sm transition-colors hover:bg-indigo-50"
                            >
                                <Icons.Download /> Exportar
                            </button>
                            {isExportMenuOpen && (
                                <div role="menu" className="absolute right-0 z-50 mt-2 w-48 overflow-hidden rounded-xl border border-slate-200 bg-white p-1.5 shadow-lg">
                                    <button
                                        type="button"
                                        role="menuitem"
                                        onClick={() => {
                                            setIsExportMenuOpen(false);
                                            exportToExcel();
                                        }}
                                        className="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-semibold text-slate-700 transition-colors hover:bg-indigo-50 hover:text-indigo-700"
                                    >
                                        <span className="text-emerald-600"><Icons.Download /></span> Exportar Excel
                                    </button>
                                    <button
                                        type="button"
                                        role="menuitem"
                                        onClick={() => {
                                            setIsExportMenuOpen(false);
                                            exportToPDF();
                                        }}
                                        className="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-semibold text-slate-700 transition-colors hover:bg-indigo-50 hover:text-indigo-700"
                                    >
                                        <span className="text-rose-600"><Icons.Download /></span> Exportar PDF
                                    </button>
                                </div>
                            )}
                        </div>,
                        exportHost
                    )}
                    <div className="flex min-h-full flex-col gap-4 animate-fade-in">
                    <section className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-violet-200 bg-gradient-to-r from-violet-50 via-white to-indigo-50 p-4 shadow-sm">
                        <label className="ml-auto flex w-full max-w-sm items-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2 shadow-sm">
                            <Icons.Search />
                            <input
                                type="search"
                                aria-label="Buscar alumnos por condición"
                                placeholder="Buscar alumno o CURP..."
                                className="w-full border-0 bg-transparent text-sm outline-none"
                                value={searchTerm}
                                onChange={event => setSearchTerm(event.target.value)}
                            />
                        </label>
                    </section>
                    <div className="table-container max-h-none flex-none overflow-x-auto overflow-y-visible rounded-2xl shadow-sm">
                        <table className="excel-table min-w-[2100px]">
                            <thead>
                                <tr>
                                    <th rowSpan="2" className="sticky-col-1 bg-amber-400 text-slate-950">No.</th>
                                    <th rowSpan="2" className="min-w-72 bg-amber-400 text-slate-950">Nombre del alumno</th>
                                    <th rowSpan="2" className="min-w-48 bg-amber-400 text-slate-950">CURP</th>
                                    <th rowSpan="2" className="min-w-28 bg-amber-400 text-slate-950">Fecha de nac.</th>
                                    <th rowSpan="2" className="min-w-24 bg-amber-400 text-slate-950">Grado / Grupo</th>
                                    <th rowSpan="2" className="min-w-14 bg-sky-600 text-white">Sexo</th>
                                    <th rowSpan="2" className="min-w-14 bg-sky-600 text-white">Años</th>
                                    <th colSpan={conditionColumns.length} className="bg-emerald-200 text-slate-950">Condición de atención</th>
                                    <th colSpan={APTITUDES_TIPOS.length} className="bg-slate-300 text-slate-950">Tipo de aptitud sobresaliente</th>
                                </tr>
                                <tr>
                                    {conditionColumns.map(column => (
                                        <th key={column.key} className={`${column.headerClass} min-w-10 max-w-10 text-slate-950`} style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)', height: '90px', fontSize: '10px', lineHeight: 1, padding: '3px 2px', whiteSpace: 'normal', overflowWrap: 'anywhere', wordBreak: 'break-word', overflow: 'hidden' }}>
                                            {column.label}
                                        </th>
                                    ))}
                                    {APTITUDES_TIPOS.map(aptitude => (
                                        <th key={aptitude} className="min-w-10 max-w-10 bg-slate-300 text-slate-950" style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)', height: '90px', fontSize: '10px', lineHeight: 1, padding: '3px 2px', whiteSpace: 'normal', overflowWrap: 'anywhere', wordBreak: 'break-word', overflow: 'hidden' }}>
                                            {aptitude}
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {filteredStudents.length === 0 ? (
                                    <tr>
                                        <td colSpan={7 + conditionColumns.length + APTITUDES_TIPOS.length} className="p-8 text-center italic text-slate-500">
                                            {searchTerm.trim() ? 'No hay alumnos que coincidan con la búsqueda.' : 'No hay alumnos activos atendidos con condición registrada.'}
                                        </td>
                                    </tr>
                                ) : filteredStudents.map((student, index) => {
                                    const age = calcularEdadCompleta(student.fechaNacimiento, fechaCorte).anios;
                                    return (
                                        <tr key={String(student.curp || student.id).trim().toUpperCase()} className="odd:bg-white even:bg-sky-50 hover:bg-violet-50">
                                            <td className="sticky-col-1 font-bold">{index + 1}</td>
                                            <td className="min-w-64 text-left font-semibold text-slate-800" style={{ textAlign: 'left' }}>{`${student.paterno || ''} ${student.materno || ''}*${student.nombres || ''}`.trim()}</td>
                                            <td className="font-mono text-xs">{student.curp || '—'}</td>
                                            <td>{formatBirthDate(student.fechaNacimiento)}</td>
                                            <td className="font-semibold">{student.grado}° {student.grupo}</td>
                                            <td>{student.sexo || '—'}</td>
                                            <td>{age}</td>
                                            {conditionColumns.map(column => (
                                                <td key={column.key} className={student.condicionUsaer === column.key ? 'bg-emerald-50 font-bold text-emerald-800' : 'text-slate-300'}>
                                                    {student.condicionUsaer === column.key ? '1' : ''}
                                                </td>
                                            ))}
                                            {APTITUDES_TIPOS.map(aptitude => (
                                                <td key={aptitude} className={student.condicionUsaer === 'Aptitudes sobresalientes' && student.subcondicionAptitudes === aptitude ? 'bg-violet-50 font-bold text-violet-800' : 'text-slate-300'}>
                                                    {student.condicionUsaer === 'Aptitudes sobresalientes' && student.subcondicionAptitudes === aptitude ? '1' : ''}
                                                </td>
                                            ))}
                                        </tr>
                                    );
                                })}
                            </tbody>
                            <tfoot>
                                <tr className="bg-emerald-50 font-bold text-slate-800">
                                    <td colSpan="6"></td>
                                    <td style={{ textAlign: 'right' }}>Subtotal</td>
                                    {conditionColumns.map(column => <td key={column.key}>{totalForColumn(column.key)}</td>)}
                                    {APTITUDES_TIPOS.map(aptitude => <td key={aptitude}>{totalForAptitude(aptitude)}</td>)}
                                </tr>

        const App = () => {
            const [currentView, setCurrentView] = useState('menu');
            const [selectedSectionTitle, setSelectedSectionTitle] = useState(null);
            const [studentToEditRequest, setStudentToEditRequest] = useState(null);
            const [globalStudentSearchTerm, setGlobalStudentSearchTerm] = useState('');
            const [isExportMenuOpen, setIsExportMenuOpen] = useState(false);
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [isDbLoading, setIsDbLoading] = useState(true);
            const [dbError, setDbError] = useState(null);
            const [user, setUser] = useState(null);
            const [syncStatus, setSyncStatus] = useState('Sincronizado');

            const [schoolConfig, setSchoolConfig] = useState({
                nombre: 'JOSÉ MARÍA MARTÍNEZ RODRÍGUEZ',
                cct: '18DPR0968U',
                director: 'CHRISTIAN ISRAEL DELGADO GARCÍA',
                lugar: 'Francisco I. Madero, Nayarit'
            });

            const [cycles, setCycles] = useState([]);
            const [activeCycleId, setActiveCycleId] = useState(null);
            const gradeUnsubscribers = useRef(new Map());
            const initializedCycles = useRef(new Set());

            useEffect(() => {
                const viewsWithStickyTableHeaders = ['inicio', 'media', 'final', 'finciclo', '911_3_inicio'];
                if (!viewsWithStickyTableHeaders.includes(currentView)) return;

                const containers = Array.from(document.querySelectorAll('.page-scroll-view .table-container'));
                const header = document.querySelector('header');
                const overlays = containers.map(container => {
                    const table = container.querySelector('table');
                    const tableHead = table?.querySelector('thead');
                    if (!table || !tableHead) return null;

                    const overlay = document.createElement('div');
                    overlay.setAttribute('aria-hidden', 'true');
                    overlay.className = 'sticky-table-header-overlay';
                    overlay.style.cssText = 'position:fixed;left:0;overflow:hidden;pointer-events:none;z-index:40;display:none;';
                    const mirror = table.cloneNode(true);
                    mirror.style.position = 'absolute';
                    mirror.style.top = '0';
                    mirror.style.margin = '0';
                    mirror.style.pointerEvents = 'none';
                    mirror.querySelectorAll('tbody, tfoot').forEach(section => {
                        section.style.visibility = 'hidden';
                    });
                    overlay.appendChild(mirror);
                    document.body.appendChild(overlay);

                    return { container, table, tableHead, overlay, mirror };
                }).filter(Boolean);

                const updateOverlays = () => {
                    const headerBottom = header?.getBoundingClientRect().bottom || 0;
                    overlays.forEach(({ container, table, tableHead, overlay, mirror }) => {
                        const containerRect = container.getBoundingClientRect();
                        const tableRect = table.getBoundingClientRect();
                        const frozenHeaderCell = tableHead.querySelector('.sticky-col-1, .usaer-sticky-col');
                        const overlayLeft = frozenHeaderCell?.getBoundingClientRect().left ?? containerRect.left;
                        const isInView = containerRect.top < headerBottom && containerRect.bottom > headerBottom;
                        if (!isInView) {
                            overlay.style.display = 'none';
                            return;
                        }

                        overlay.style.display = 'block';
                        overlay.style.top = `${headerBottom}px`;
                        overlay.style.left = `${overlayLeft}px`;
                        overlay.style.width = `${Math.max(0, containerRect.right - overlayLeft)}px`;
                        overlay.style.height = `${tableHead.getBoundingClientRect().height}px`;
                        mirror.style.left = `${tableRect.left - overlayLeft}px`;
                        mirror.style.width = `${tableRect.width}px`;
                        mirror.style.minWidth = `${tableRect.width}px`;
                    });
                };

                window.addEventListener('scroll', updateOverlays, { passive: true });
                window.addEventListener('resize', updateOverlays);
                containers.forEach(container => container.addEventListener('scroll', updateOverlays, { passive: true }));
                updateOverlays();

                return () => {
                    window.removeEventListener('scroll', updateOverlays);
                    window.removeEventListener('resize', updateOverlays);
                    containers.forEach(container => container.removeEventListener('scroll', updateOverlays));
                    overlays.forEach(({ overlay }) => overlay.remove());
                };
            }, [currentView]);

            const queueGradeDocuments = (batch, fb, cycle, students) => {
                GRADOS.forEach(grade => {
                    const gradeRef = fb.doc(fb.db, 'artifacts', 'estadistica-jmmr', 'public', 'data', 'cycles', cycle.id, 'grades', String(grade));
                    const gradeStudents = students.filter(student => Number(student.grado) === grade);
                    batch.set(gradeRef, {
                        cycleId: cycle.id,
                        grade,
                        students: gradeStudents,
                        updatedAt: new Date().toISOString()
                    });

                    const statistics = crearEstadisticasGrado(gradeStudents, cycle.config || {}, cycle.id, grade);
                    TIPOS_ESTADISTICA.forEach(type => {
                        batch.set(fb.doc(gradeRef, 'statistics', type), statistics[type]);
                    });
                });
            };

            useEffect(() => {
                const checkFirebase = () => {
                    if (window.firebaseAPI) setIsFirebaseReady(true);
                    else setTimeout(checkFirebase, 100);
                };
                checkFirebase();
            }, []);

            useEffect(() => {
                if (!isFirebaseReady) return;
                let isMounted = true;
                const unsubscribeFunctions = [];

                const initFirebase = async () => {
                    try {
                        const fb = window.firebaseAPI;
                        
                        let userCredential;
                        try {
                            userCredential = await fb.signInAnonymously(fb.auth);
                            if (isMounted) setUser(userCredential.user);
                        } catch (authErr) {
                            throw new Error("La Autenticación Anónima está APAGADA en tu consola de Firebase.");
                        }

                        const appId = 'estadistica-jmmr'; 
                        const configRef = fb.doc(fb.db, 'artifacts', appId, 'public', 'data', 'config', 'schoolConfig');
                        const cyclesColl = fb.collection(fb.db, 'artifacts', appId, 'public', 'data', 'cycles');

                        unsubscribeFunctions.push(fb.onSnapshot(configRef, (docSnap) => {
                            if (docSnap.exists() && isMounted) setSchoolConfig(docSnap.data());
                        }, (error) => {
                            console.error('Error al leer la configuración escolar de Firestore:', error);
                            if (isMounted) setDbError(`No se pudo leer la configuración escolar: ${error.message}`);
                        }));

                        unsubscribeFunctions.push(fb.onSnapshot(cyclesColl, async (snapshot) => {
                            if (!isMounted) return;
                            try {
                                if (snapshot.empty) {
                                    const seedCycle = {
                                        id: '2025-2026',
                                        label: '2025 - 2026',
                                        config: { fechaCorte: '2025-09-01', supervisor: 'NOMBRE DEL SUPERVISOR', docenteUsaer: 'NOMBRE DEL DOCENTE USAER', fechaFirma: '2025-09-30' }
                                    };
                                    const batch = fb.writeBatch(fb.db);
                                    batch.set(fb.doc(fb.db, 'artifacts', appId, 'public', 'data', 'cycles', seedCycle.id), seedCycle);
                                    queueGradeDocuments(batch, fb, seedCycle, []);
                                    await batch.commit();
                                    return;
                                }

                                const loaded = [];
                                for (const cycleSnapshot of snapshot.docs) {
                                    const cycleData = cycleSnapshot.data();
                                    const cycle = {
                                        ...cycleData,
                                        id: cycleData.id || cycleSnapshot.id,
                                        config: cycleData.config || { fechaCorte: '2025-09-01' }
                                    };
                                    if (initializedCycles.current.has(cycle.id)) {
                                        loaded.push({ ...cycleData, id: cycle.id, config: cycle.config, students: [] });
                                        continue;
                                    }
                                    const cycleRef = fb.doc(fb.db, 'artifacts', appId, 'public', 'data', 'cycles', cycle.id);
                                    const gradesSnapshot = await fb.getDocs(fb.collection(cycleRef, 'grades'));
                                    const existingGrades = new Map(gradesSnapshot.docs.map(gradeDoc => [Number(gradeDoc.id), gradeDoc]));
                                    const legacyStudents = Array.isArray(cycleData.students) ? cycleData.students : [];
                                    const batch = fb.writeBatch(fb.db);
                                    let hasWrites = false;

                                    for (const grade of GRADOS) {
                                        const gradeSnapshot = existingGrades.get(grade);
                                        const gradeRef = fb.doc(cycleRef, 'grades', String(grade));
                                        const hasValidGradeRoster = gradeSnapshot && Array.isArray(gradeSnapshot.data().students);
                                        const gradeStudents = hasValidGradeRoster
                                            ? gradeSnapshot.data().students
                                            : legacyStudents.filter(student => Number(student.grado) === grade);
                                        if (!hasValidGradeRoster) {
                                            batch.set(gradeRef, { cycleId: cycle.id, grade, students: gradeStudents, updatedAt: new Date().toISOString() });
                                            hasWrites = true;
                                        }

                                        const statisticsSnapshot = await fb.getDocs(fb.collection(gradeRef, 'statistics'));
                                        const statistics = crearEstadisticasGrado(gradeStudents, cycle.config, cycle.id, grade);
                                        TIPOS_ESTADISTICA.forEach(type => {
                                            if (!statisticsSnapshot.docs.some(statDoc => statDoc.id === type)) {
                                                batch.set(fb.doc(gradeRef, 'statistics', type), statistics[type]);
                                                hasWrites = true;
                                            }
                                        });
                                    }

                                    if (Object.prototype.hasOwnProperty.call(cycleData, 'students')) {
                                        batch.set(cycleRef, { students: fb.deleteField() }, { merge: true });
                                        hasWrites = true;
                                    }
                                    if (hasWrites) await batch.commit();

                                    if (!gradeUnsubscribers.current.has(cycle.id)) {
                                        const unsubscribeGrades = fb.onSnapshot(fb.collection(cycleRef, 'grades'), (gradeSnapshot) => {
                                            if (!isMounted) return;
                                            const students = gradeSnapshot.docs
                                                .flatMap(gradeDoc => Array.isArray(gradeDoc.data().students) ? gradeDoc.data().students : [])
                                                .sort((a, b) => Number(a.grado) - Number(b.grado) || String(a.paterno || '').localeCompare(String(b.paterno || '')));
                                            setCycles(previous => previous.map(item => item.id === cycle.id ? { ...item, students } : item));
                                        }, error => {
                                            console.error(`Error al leer el padrón del ciclo ${cycle.id}:`, error);
                                            if (isMounted) setDbError(`No se pudo leer el padrón del ciclo ${cycle.label}: ${error.message}`);
                                        });
                                        gradeUnsubscribers.current.set(cycle.id, unsubscribeGrades);
                                    }

                                    const cycleWithoutRoster = { ...cycleData };
                                    delete cycleWithoutRoster.students;
                                    loaded.push({ ...cycleWithoutRoster, id: cycle.id, config: cycle.config, students: [] });
                                    initializedCycles.current.add(cycle.id);
                                }

                                loaded.sort((a, b) => b.id.localeCompare(a.id));
                                setCycles(previous => loaded.map(cycle => ({
                                    ...cycle,
                                    students: previous.find(item => item.id === cycle.id)?.students || []
                                })));
                                setActiveCycleId(current => loaded.some(cycle => cycle.id === current) ? current : loaded[0]?.id || null);
                                setIsDbLoading(false);
                            } catch (error) {
                                console.error('Error al preparar la estructura de grados y estadísticas en Firestore:', error);
                                if (isMounted) {
                                    setDbError(`No se pudo preparar el padrón por grado y sus estadísticas: ${error.message}`);
                                    setIsDbLoading(false);
                                }
                            }
                        }, (error) => {
                            console.error('Error al leer los ciclos de Firestore:', error);
                            if (isMounted) {
                                setDbError(`No se pudieron leer los ciclos escolares: ${error.message}`);
                                setIsDbLoading(false);
                            }
                        }));

                    } catch (error) {
                        if (isMounted) {
                            setIsDbLoading(false);
                            setDbError(error.message);
                        }
                    }
                };
                
                initFirebase();
                return () => {
                    isMounted = false;
                    unsubscribeFunctions.forEach(unsubscribe => unsubscribe());
                    gradeUnsubscribers.current.forEach(unsubscribe => unsubscribe());
                    gradeUnsubscribers.current.clear();
                    initializedCycles.current.clear();
                };
            }, [isFirebaseReady]);

            const saveConfigToFirestore = async (newGlobalConfig, newCycleConfig) => {
                if (!user || !activeCycleId) return setSyncStatus('Error: Sin Autenticación');
                try {
                    setSyncStatus('Sincronizando...');
                    const fb = window.firebaseAPI;
                    const activeCycle = cycles.find(c => c.id === activeCycleId);
                    if (!activeCycle) throw new Error('No se encontró el ciclo escolar activo.');
                    const updatedCycle = { ...activeCycle, config: newCycleConfig };
                    const batch = fb.writeBatch(fb.db);
                    batch.set(fb.doc(fb.db, 'artifacts', 'estadistica-jmmr', 'public', 'data', 'config', 'schoolConfig'), newGlobalConfig);
                    batch.set(fb.doc(fb.db, 'artifacts', 'estadistica-jmmr', 'public', 'data', 'cycles', activeCycleId), {
                        id: activeCycle.id,
                        label: activeCycle.label,
                        config: newCycleConfig
                    }, { merge: true });
                    queueGradeDocuments(batch, fb, updatedCycle, activeCycle.students || []);
                    await batch.commit();
                    setSyncStatus('Sincronizado');
                } catch (e) {
                    console.error('No se pudo guardar la configuración y actualizar las estadísticas:', e);
                    setSyncStatus('Error al Sincronizar');
                }
            };

            const addCycleToFirestore = async (cycleLabel, importStudents = false) => {
                if (!user) return setSyncStatus('Error: Sin Autenticación');
                const newId = cycleLabel.replace(/\s+/g, '-');
                if (cycles.find(c => c.id === newId)) return; 
                
                let newStudents = [];
                if (importStudents && activeCycleId) {
                    const currentCycle = cycles.find(c => c.id === activeCycleId);
                    if (currentCycle) {
                        newStudents = (currentCycle.students || [])
                            .filter(s => s.estatus !== 'Baja')
                            .filter(s => !(s.grado === 6 && s.acreditacion === 'Promovido'))
                            .map(s => {
                                const isRepeater = s.acreditacion === 'No Promovido';
                                return {
                                    ...s,
                                    id: Date.now() + Math.random(),
                                    grado: isRepeater ? s.grado : (s.grado + 1),
                                    condicion: isRepeater ? 'Repetidores' : 'Inscripción',
                                    fechaAlta: '',
                                    fechaBaja: '',
                                    acreditacion: 'Promovido'
                                };
                            });
                    }
                }

                const newCycle = { 
                    id: newId, 
                    label: cycleLabel, 
                    config: {
                        fechaCorte: `${cycleLabel.substring(0,4)}-09-01`,
                        supervisor: schoolConfig.supervisor || 'NOMBRE DEL SUPERVISOR',
                        docenteUsaer: schoolConfig.docenteUsaer || 'NOMBRE DEL DOCENTE USAER',
                        fechaFirma: `${parseInt(cycleLabel.substring(0,4))+1}-07-01`
                    }
                };
                
                try {
                    setSyncStatus('Sincronizando...');
                    const fb = window.firebaseAPI;
                    const batch = fb.writeBatch(fb.db);
                    batch.set(fb.doc(fb.db, 'artifacts', 'estadistica-jmmr', 'public', 'data', 'cycles', newId), newCycle);
                    queueGradeDocuments(batch, fb, newCycle, newStudents);
                    await batch.commit();
                    setActiveCycleId(newId);
                    setSyncStatus('Sincronizado');
                } catch (e) {
                    console.error('Error al crear el ciclo con sus grados y estadísticas:', e);
                    setSyncStatus('Error al Sincronizar');
                }
            };

            const deleteCycleFromFirestore = async (cycleId) => {
                if (!user) throw new Error('No hay una sesión autenticada para eliminar ciclos.');

                try {
                    setSyncStatus('Sincronizando...');
                    const fb = window.firebaseAPI;
                    const cyclesSnapshot = await fb.getDocs(fb.collection(fb.db, 'artifacts', 'estadistica-jmmr', 'public', 'data', 'cycles'));
                    if (cyclesSnapshot.size <= 1) throw new Error('Debe conservar al menos un ciclo escolar en el sistema.');

                    const cycleSnapshot = cyclesSnapshot.docs.find(cycleDoc => cycleDoc.id === cycleId);
                    if (!cycleSnapshot) throw new Error('El ciclo escolar ya no existe en Firebase.');

                    const cycleRef = cycleSnapshot.ref;
                    const gradesSnapshot = await fb.getDocs(fb.collection(cycleRef, 'grades'));
                    const relatedDocumentRefs = [];
                    for (const gradeSnapshot of gradesSnapshot.docs) {
                        const statisticsSnapshot = await fb.getDocs(fb.collection(gradeSnapshot.ref, 'statistics'));
                        relatedDocumentRefs.push(...statisticsSnapshot.docs.map(statisticsDoc => statisticsDoc.ref));
                        relatedDocumentRefs.push(gradeSnapshot.ref);
                    }

                    for (let offset = 0; offset < relatedDocumentRefs.length; offset += 450) {
                        const batch = fb.writeBatch(fb.db);
                        relatedDocumentRefs.slice(offset, offset + 450).forEach(documentRef => batch.delete(documentRef));
                        await batch.commit();
                    }

                    const deleteCycleBatch = fb.writeBatch(fb.db);
                    deleteCycleBatch.delete(cycleRef);
                    await deleteCycleBatch.commit();

                    const unsubscribeGrades = gradeUnsubscribers.current.get(cycleId);
                    if (unsubscribeGrades) {
                        unsubscribeGrades();
                        gradeUnsubscribers.current.delete(cycleId);
                    }
                    initializedCycles.current.delete(cycleId);

                    const nextCycleId = cyclesSnapshot.docs
                        .filter(cycleDoc => cycleDoc.id !== cycleId)

                setCycles(prev => prev.map(c => c.id === activeCycleId ? updatedCycle : c));
                setSyncStatus('Sincronizando...');

            const getGradeBlockRanges = table => {
