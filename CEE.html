                Array.from(table.tBodies).forEach(tbody => {
                    Array.from(tbody.rows).forEach((row, rowIndex) => {
                        const absoluteStart = allRows.indexOf(row);
                        const cells = Array.from(row.cells);
                        const gradeCell = cells.find(cell => /^[1-6]°$/.test(cell.textContent.trim()));
                        const totalCell = cells.find(cell => /^total$/i.test(cell.textContent.trim()));

                        [gradeCell, totalCell].filter(Boolean).forEach(cell => {
                            const rowSpan = Math.max(1, cell.rowSpan || 1);
                            blocks.push({
                                section: 'body',
                                start: rowIndex,
                                end: Math.min(tbody.rows.length - 1, rowIndex + rowSpan - 1),
                                excelStart: absoluteStart,
                                excelEnd: absoluteStart + rowSpan - 1
                            });
                        });
                    });
                });

                Array.from(table.tFoot?.rows || []).forEach((row, rowIndex) => {
                    const totalCell = Array.from(row.cells).find(cell => /^total$/i.test(cell.textContent.trim()));

                    const rowSpan = Math.max(1, totalCell.rowSpan || 1);
                    const absoluteStart = allRows.indexOf(row);
                    blocks.push({
                        section: 'foot',
                        start: rowIndex,
                        end: Math.min(table.tFoot.rows.length - 1, rowIndex + rowSpan - 1),
                        excelStart: absoluteStart,
                        excelEnd: absoluteStart + rowSpan - 1

                                        data.cell.styles.fillColor = color.slice(1).map(Number);
                                    }
                                    const text = element.textContent.trim().replace(/,/g, '');
                                    if (data.section === 'head') {
                                        data.cell.styles.halign = 'center';
                                        data.cell.styles.textColor = [0, 0, 0];
                                    } else if (/^-?\d+(?:\.\d+)?\+?$/.test(text)) {
                                        data.cell.styles.halign = 'center';
                                        const labels = Array.from(element.closest('tr')?.cells || []).map(cell =>
                                            cell.textContent.trim().replace(/\s+/g, ' ')
                                        );
                                        const isTotal = labels.some(label =>
                                            /(?:^|\s)total(?:$|\s)/i.test(label) && !/^subtotal\b/i.test(label)
                                        );
                                        data.cell.styles.textColor = isTotal ? [30, 64, 175] : [0, 0, 0];
                                        data.cell.styles.fontStyle = isTotal ? 'bold' : 'normal';
                                    }
                                }
                            });
                            nextY = pdf.lastAutoTable.finalY + 4;
                        });

                        let signatureY = nextY + 6;
                        if (signatureY + 20 > landscapeHeight - 3) {
                            pdf.addPage();
                            drawPageHeader();
                            drawPageNumber();
                            signatureY = 38;
                        }
                        pdf.setFont('helvetica', 'normal');
                        pdf.setFontSize(8);
                        pdf.text('Director', landscapeWidth / 2, signatureY, { align: 'center' });
                        pdf.setDrawColor(60);
                        pdf.setLineWidth(0.3);
                        pdf.line(landscapeWidth * 0.35, signatureY + 8, landscapeWidth * 0.65, signatureY + 8);
                        pdf.text(schoolConfig.director || 'Director de la escuela', landscapeWidth / 2, signatureY + 12, {
                            align: 'center',
                            maxWidth: landscapeWidth * 0.55
                        });
                        pdf.setFontSize(7);
                        pdf.text('DIRECTOR DE LA ESCUELA', landscapeWidth / 2, signatureY + 17, { align: 'center' });
                        pdf.save(`${title.replace(/[^a-zA-Z0-9_-]+/g, '_')}_${safeCycle}.pdf`);
                        return;
                    }

                    for (const fontSize of fontSizes) {
                        const pdf = new JsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
                        let nextY = 30;

                        drawPdfLogo(pdf, 33);
                        pdf.setFont('helvetica', 'bold');
                        pdf.setFontSize(12);
                        pdf.text(title, (pageWidth + 45) / 2, 9, { align: 'center', maxWidth: pageWidth - 52 });
                        pdf.setFontSize(8);
                        pdf.text(`Escuela: ${schoolName}`, 7, 16, { maxWidth: pageWidth - 14 });
                        pdf.setFontSize(8);
                        pdf.text(`Clave (CCT): ${schoolKey}`, 7, 23);
                        pdf.text(`Ciclo escolar: ${cycleLabel}`, pageWidth - 7, 23, { align: 'right' });
                        pdf.setDrawColor(80);
                        pdf.setLineWidth(0.35);
                        pdf.line(7, 26, pageWidth - 7, 26);

                        tables.forEach(table => {
                            const gradeBlocks = getGradeBlockRanges(table);
                            pdf.autoTable({
                                html: table,
                                startY: nextY,
                                theme: 'grid',
                                tableWidth: 'auto',
                                styles: {
                                    font: 'helvetica',
                                    fontSize,
                                    textColor: [0, 0, 0],
                                    cellPadding: 0.35,
                                    overflow: 'linebreak',
                                    valign: 'middle',
                                    minCellHeight: 6,
                                    lineColor: [71, 85, 105],
                                    lineWidth: 0.15
                                },
                                headStyles: { fillColor: [226, 232, 240], textColor: [0, 0, 0], fontStyle: 'bold', lineWidth: 0.25 },
                                margin: { top: 30, right: 6, bottom: 35, left: 6 },
                                rowPageBreak: 'avoid',
                                didDrawCell: data => {
                                    const block = gradeBlocks.find(item =>
                                        item.section === data.section
                                        && data.row.index >= item.start
                                        && data.row.index <= item.end
                                    );
                                    if (!block) return;

                                    const { x, y, width, height } = data.cell;
                                    data.doc.setDrawColor(15, 23, 42);
                                    data.doc.setLineWidth(0.7);
                                    if (data.row.index === block.start) data.doc.line(x, y, x + width, y);
                                    if (data.row.index === block.end) data.doc.line(x, y + height, x + width, y + height);
                                    if (data.column.index === 0) data.doc.line(x, y, x, y + height);
                                    if (data.column.index === data.table.columns.length - 1) data.doc.line(x + width, y, x + width, y + height);
                                },
                                didParseCell: data => {
                                    const element = data.cell.raw;
                                    if (!(element instanceof HTMLElement)) return;

                                    const background = getComputedStyle(element).backgroundColor;
                                    const color = background.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                                    const rgb = color?.slice(1).map(Number);
                                    const isOrangeCell = rgb && rgb[0] >= 220 && rgb[1] >= 90 && rgb[1] <= 225 && rgb[2] <= 190 && rgb[0] - rgb[1] >= 25;
                                    if (color && background !== 'rgba(0, 0, 0, 0)') {
                                        data.cell.styles.fillColor = rgb;
                                    }

                                    const text = element.textContent.trim().replace(/,/g, '');
                                    if (data.section === 'head') {
                                        data.cell.styles.halign = 'center';
                                        data.cell.styles.textColor = [0, 0, 0];
                                    } else if (/^-?\d+(?:\.\d+)?\+?$/.test(text)) {
                                        data.cell.styles.halign = 'center';
                                        const rowLabels = Array.from(element.closest('tr')?.cells || [])
                                            .map(cell => cell.textContent.trim().replace(/\s+/g, ' '));
                                        const isTotal = rowLabels.some(label =>
                                            /(?:^|\s)total(?:$|\s)/i.test(label) && !/^subtotal\b/i.test(label)
                                        );
                                        const highlightNumber = isTotal || isOrangeCell;
                                        data.cell.styles.textColor = highlightNumber ? [30, 64, 175] : [0, 0, 0];
                                        data.cell.styles.fontStyle = highlightNumber ? 'bold' : 'normal';
                                    } else if (!color && data.section === 'body' && data.row.index % 2 === 1) {
                                        data.cell.styles.fillColor = [248, 250, 252];
                                    }
                                }
                            });
                            nextY = pdf.lastAutoTable.finalY + 3;
                        });

                        const signatureY = nextY + 8;
                        if (pdf.getNumberOfPages() === 1 && signatureY + 12 <= pageHeight - 5) {
                            pdf.setFont('helvetica', 'normal');
                            pdf.setFontSize(8);
                            pdf.text('Director', pageWidth / 2, signatureY, { align: 'center' });
                            pdf.setDrawColor(60);
                            pdf.setLineWidth(0.3);
                            pdf.line(pageWidth * 0.28, signatureY + 10, pageWidth * 0.72, signatureY + 10);
                            pdf.setFontSize(8);
                            pdf.text(schoolConfig.director || 'Director de la escuela', pageWidth / 2, signatureY + 14, {
                                align: 'center',
                                maxWidth: pageWidth * 0.55
                            });
                            pdf.setFontSize(7);
                            pdf.text('DIRECTOR DE LA ESCUELA', pageWidth / 2, signatureY + 18, { align: 'center' });
                            if (signatureY + 21 <= pageHeight - 2) fittedPdf = pdf;
                            if (fittedPdf) break;
                        }
                    }

                    if (!fittedPdf) {
                        throw new Error('La tabla del reporte es demasiado extensa para ajustarse en una sola hoja carta vertical.');
                    }
                    fittedPdf.save(`${title.replace(/[^a-zA-Z0-9_-]+/g, '_')}_${safeCycle}.pdf`);
                } catch (error) {
                    console.error('No se pudo exportar el reporte a PDF:', error);
                    window.alert(`No se pudo exportar a PDF: ${error.message}`);
                }
            };

            if (dbError) {

                            <h2 className="text-2xl font-bold mb-4 text-center text-red-400">Firebase bloqueó la conexión</h2>
                            <p className="text-slate-300 mb-6 text-center">{dbError}</p>

                                <h3 className="font-bold text-emerald-400 mb-3 flex items-center gap-2"><Icons.CheckCircle/> Sigue estos 2 pasos en tu Firebase:</h3>
                                <ol className="list-decimal pl-5 space-y-4 text-sm text-slate-300">
                                    <li><strong className="text-white">Habilitar Autenticación:</strong><br/>Ve a <span className="font-mono text-emerald-200">Authentication &gt; Sign-in method</span> y habilita el proveedor <b>Anónimo</b>.</li>
                                    <li><strong className="text-white">Abrir las Reglas de Base de Datos:</strong><br/>Ve a <span className="font-mono text-emerald-200">Firestore Database &gt; Rules</span> y pega exactamente esto:
                                        <pre className="bg-slate-900 p-3 rounded-lg mt-2 text-emerald-300 border border-slate-700 font-mono text-xs">{`rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}`}</pre>
                                    </li>
                                </ol>
                            </div>
                            
                            <div className="flex justify-center mt-8">
                                <button onClick={() => window.location.reload()} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition-colors flex items-center gap-2">
                                    <Icons.Cloud /> Ya lo corregí, Reintentar
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (isDbLoading) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-900 text-white flex-col">
                        <div className="w-12 h-12 border-4 border-slate-700 border-t-blue-500 rounded-full animate-spin mb-4"></div>
                        <h2 className="text-xl font-bold">Conectando con Firebase...</h2>
                        <p className="text-slate-400 mt-2 text-sm">Cargando base de datos segura (v7.0)</p>
                    </div>
                );
            }

            const activeCycle = cycles.find(c => c.id === activeCycleId) || cycles[0];
            const activeCycleConfig = activeCycle?.config || { fechaCorte: '2025-09-01' };
            const students = activeCycle ? activeCycle.students : [];
            const usesPageVerticalScroll = ['database', 'inicio', 'media', 'final', 'finciclo', '911_3_inicio'].includes(currentView);
            const parentSectionByView = {
                database: 'Gestión escolar',
                config: 'Gestión escolar',
                inicio: 'Estadística',
                media: 'Estadística',
                final: 'Estadística',
                finciclo: 'Estadística',
                '911_3_inicio': 'Estadística 911',
                '911_4': 'Estadística 911',
                usaer: 'Educación Especial',
                usaer_911_4: 'Educación Especial',
                'ee-students': 'Educación Especial',
                'ee-condition-list': 'Educación Especial'

            const parentSectionTitle = parentSectionByView[currentView];
            const navigationSections = [
                { title: 'Gestión escolar', icon: <Icons.Users />, iconClass: 'bg-blue-100 text-blue-800', section: 'Gestión escolar', items: [{ label: 'Alumnos', view: 'database' }, { label: 'Configuración', view: 'config' }] },
                { title: 'Estadística', icon: <Icons.BarChart />, iconClass: 'bg-emerald-100 text-emerald-700', section: 'Estadística', items: [{ label: 'Inicio', view: 'inicio' }, { label: 'Media', view: 'media' }, { label: 'Final', view: 'final' }, { label: 'Fin de Ciclo', view: 'finciclo' }] },
                { title: 'Estadística 911', icon: <Icons.List />, iconClass: 'bg-amber-100 text-amber-700', section: 'Estadística 911', items: [{ label: '911.3', view: '911_3_inicio' }, { label: '911.4', view: '911_4' }] },
                { title: 'Educación Especial', icon: <Icons.Heart />, iconClass: 'bg-violet-100 text-violet-700', section: 'Educación Especial', items: [{ label: 'Listado de alumnos de EE', view: 'ee-students' }, { label: 'Listado por condición', view: 'ee-condition-list' }, { label: 'Especial 911.3', view: 'usaer' }, { label: 'Especial 911.4', view: 'usaer_911_4' }] },
                { title: 'Búsqueda de Alumnos', icon: <Icons.Search />, iconClass: 'bg-emerald-100 text-emerald-700', view: 'student-search' }
            ];
            const selectedNavigationItems = navigationSections.find(section => section.section === selectedSectionTitle)?.items;

            return (
                <div className={`app-theme flex flex-col bg-slate-50 print:h-auto print:bg-white ${
                    usesPageVerticalScroll ? 'page-scroll-view min-h-screen overflow-visible' : 'h-screen overflow-hidden'
                }`}>
                    <header className={`shrink-0 border-b border-slate-200 bg-white shadow-sm print-hide ${

                            <div className={`flex flex-col gap-2 border-b border-slate-200 bg-white px-3 py-2 md:px-4 print-hide ${
                                currentView === 'menu'
                                    ? selectedSectionTitle ? 'h-auto min-h-[80px] items-start' : 'h-[80px] justify-center'
                                    : 'md:flex-row md:items-center md:justify-between'
                            }`}>
                                <div className="w-full">
                                    {currentView !== 'menu' && (
                                        <>
                                            <h1 className="text-xl font-extrabold tracking-tight text-slate-800 md:text-2xl">
                                                {currentView === 'database' ? 'Padrón de Alumnos' :
                                                currentView === 'ee-students' ? 'Listado de alumnos de Educación Especial' :
                                                currentView === 'ee-condition-list' ? 'Listado por condición de Educación Especial' :
                                                currentView === 'config' ? 'Configuración del Sistema' :
                                                 currentView === 'student-search' ? 'Búsqueda Global de Alumnos' :
                                                 currentView === '911_3_inicio' ? 'Estadística 911.3 - Inicio' :
                                                 currentView === '911_4' ? 'Estadística 911.4' :
                                                 currentView === 'finciclo' ? 'Formato - Fin de Ciclo' :
                                                 currentView === 'usaer' ? 'Estadística USAER (911.3)' :
                                                 currentView === 'usaer_911_4' ? 'Estadística USAER (911.4 Final)' :
                                                 `Estadística ${currentView === 'inicio' ? 'Inicio' : currentView === 'media' ? 'Media' : 'Final'}`}
                                            </h1>
                                            <p className="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs font-medium text-slate-500 md:text-sm">
                                                <span className="truncate">Escuela: <span className="font-semibold text-indigo-700">{schoolConfig.nombre}</span></span>
                                                <span className="hidden text-slate-300 sm:inline">|</span>
                                                <span>Ciclo: <span className="font-semibold text-indigo-700">{activeCycle?.label || '—'}</span></span>
                                            </p>
                                        </>
                                    )}
                                    {(currentView === 'menu' || currentView === 'student-search') && (
                                        <>
                                        <div className="grid w-full grid-cols-1 gap-2 sm:grid-cols-3 md:grid-cols-5" aria-label="Secciones principales">
                                            {navigationSections.map(section => {
                                                const isSelected = section.view
                                                    ? currentView === section.view
                                                    : currentView === 'menu' && selectedSectionTitle === section.section;
                                                return (
                                                    <button
                                                        key={section.title}
                                                        type="button"
                                                        aria-pressed={isSelected}
                                                        aria-expanded={section.items ? selectedSectionTitle === section.section : undefined}
                                                        onClick={() => {
                                                            if (section.view) {
                                                                setSelectedSectionTitle(null);
                                                                setCurrentView(section.view);
                                                            } else {
                                                                setCurrentView('menu');
                                                                setSelectedSectionTitle(current => current === section.section ? null : section.section);
                                                            }
                                                        }}
                                                        className={`flex min-h-9 w-full items-center gap-1 rounded-xl border bg-white px-2 py-1 text-left shadow-sm transition-all ${
                                                            isSelected
                                                                ? 'border-indigo-600 ring-2 ring-indigo-600/20'
                                                                : 'border-slate-200 hover:border-indigo-300 hover:shadow-md'
                                                        }`}
                                                    >
                                                        <span className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-lg ${section.iconClass}`}>
                                                            {section.icon}
                                                        </span>
                                                        <span className="whitespace-nowrap text-xs font-bold text-slate-800">{section.title}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        {selectedNavigationItems && (
                                            <div
                                                aria-label={`Opciones de ${selectedSectionTitle}`}
                                                className="mt-1 flex w-full flex-wrap gap-2"
                                            >
                                                {selectedNavigationItems.map(item => (
                                                    <button
                                                        key={item.view}
                                                        type="button"
                                                        onClick={() => {
                                                            setSelectedSectionTitle(null);
                                                            setCurrentView(item.view);
                                                        }}
                                                        className="flex min-h-9 flex-1 basis-32 items-center justify-center rounded-lg border border-slate-200 bg-slate-50 px-3 text-xs font-semibold text-slate-700 transition-colors hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-700"
                                                    >
                                                        {item.label}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                        </>
                                    )}
                                </div>
                                <div className="flex items-center gap-3">
                                    {(currentView === 'ee-condition-list' || currentView === 'ee-students') && (
                                        <div id={currentView === 'ee-students' ? 'ee-students-export-slot' : 'ee-condition-export-slot'} className="relative" />
                                    )}
                                    {currentView !== 'database' && currentView !== 'ee-students' && currentView !== 'ee-condition-list' && currentView !== 'config' && currentView !== 'menu' && currentView !== 'student-search' && (
                                        <div className="flex items-center gap-2">
                                            <div className="relative">
                                                <button
                                                    type="button"
                                                    aria-haspopup="menu"
                                                    aria-expanded={isExportMenuOpen}
                                                    onClick={() => setIsExportMenuOpen(open => !open)}
                                                    className="flex items-center gap-2 rounded-xl border border-indigo-200 bg-white px-4 py-2.5 text-sm font-bold text-indigo-700 shadow-sm transition-colors hover:bg-indigo-50"
                                                >
                                                    <Icons.Download /> Exportar
                                                </button>
                                                {isExportMenuOpen && (
                                                    <div role="menu" className="absolute right-0 z-50 mt-2 w-44 overflow-hidden rounded-xl border border-slate-200 bg-white p-1.5 shadow-lg">
                                                        <button
                                                            type="button"
                                                            role="menuitem"
                                                            onClick={exportCurrentViewToExcel}
                                                            className="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-semibold text-slate-700 transition-colors hover:bg-indigo-50 hover:text-indigo-700"
                                                        >
                                                            <span className="text-emerald-600"><Icons.Download /></span> Excel (.xlsx)
                                                        </button>
                                                        <button
                                                            type="button"
                                                            role="menuitem"
                                                            onClick={exportCurrentViewToPDF}
                                                            className="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-semibold text-slate-700 transition-colors hover:bg-indigo-50 hover:text-indigo-700"
                                                        >
                                                            <span className="text-rose-600"><Icons.Download /></span> PDF
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className={`p-4 md:p-6 print:overflow-visible print:p-0 ${
                                usesPageVerticalScroll || currentView === 'ee-condition-list' || currentView === 'ee-students' ? 'flex-none overflow-visible' : 'min-h-0 flex-1 overflow-hidden'
                            }`}>
                                <div className={`rounded-2xl print:h-auto print:overflow-visible print:rounded-none ${
                                    usesPageVerticalScroll || currentView === 'ee-condition-list' || currentView === 'ee-students' ? 'h-auto overflow-visible' : 'h-full overflow-hidden'
                                }`}>
                                    {currentView === 'menu' && <MainPanel students={students} specialEducationSelected={selectedSectionTitle === 'Educación Especial'} />}
                                    {currentView === 'config' && <Configuracion schoolConfig={schoolConfig} activeCycle={activeCycle} cycles={cycles} onAddCycle={addCycleToFirestore} onActivateCycle={setActiveCycleId} onDeleteCycle={deleteCycleFromFirestore} onSaveConfig={saveConfigToFirestore} />}
                                    {currentView === 'database' && <Database students={students} onUpdateStudents={updateStudentsInFirestore} fechaCorte={activeCycleConfig.fechaCorte} setFechaCorte={()=>{}} activeCycleLabel={activeCycle?.label} activeCycleId={activeCycle?.id} studentToEditRequest={studentToEditRequest} onStudentEditRequestHandled={() => setStudentToEditRequest(null)} onReturnToGlobalSearch={() => setCurrentView('student-search')} />}
                                    {currentView === 'ee-students' && <Database students={students} onUpdateStudents={updateStudentsInFirestore} fechaCorte={activeCycleConfig.fechaCorte} setFechaCorte={()=>{}} activeCycleLabel={activeCycle?.label} activeCycleId={activeCycle?.id} schoolConfig={schoolConfig} studentToEditRequest={null} onStudentEditRequestHandled={() => {}} onReturnToGlobalSearch={() => setCurrentView('student-search')} specialEducationOnly />}
                                    {currentView === 'ee-condition-list' && <SpecialEducationConditionList students={students} fechaCorte={activeCycleConfig.fechaCorte} activeCycleLabel={activeCycle?.label} schoolConfig={schoolConfig} />}
                                    {currentView === 'student-search' && (
                                        <GlobalStudentSearch
                                            cycles={cycles}
                                            searchTerm={globalStudentSearchTerm}
                                            onSearchTermChange={setGlobalStudentSearchTerm}
                                            onEditStudent={(cycle, student) => {
                                                setStudentToEditRequest({ cycleId: cycle.id, studentId: student.id, returnToGlobalSearch: true });
                                                setActiveCycleId(cycle.id);
                                                setCurrentView('database');
                                            }}
                                        />
                                    )}
                                    {currentView === '911_3_inicio' && <Format911_3_Inicio students={students} cycleConfig={activeCycleConfig} configGlobal={schoolConfig} activeCycleLabel={activeCycle?.label} />}
                                    {currentView === '911_4' && <Format911_4 students={students} configGlobal={schoolConfig} cycleConfig={activeCycleConfig} activeCycleLabel={activeCycle?.label} />}
                                    {currentView === 'inicio' && <Format911 students={students} cycleConfig={activeCycleConfig} tipo="Inicio" configGlobal={schoolConfig} activeCycleLabel={activeCycle?.label} />}
                                    {currentView === 'media' && <Format911 students={students} cycleConfig={activeCycleConfig} tipo="Media" configGlobal={schoolConfig} activeCycleLabel={activeCycle?.label} />}
                                    {currentView === 'final' && <Format911 students={students} cycleConfig={activeCycleConfig} tipo="Final" configGlobal={schoolConfig} activeCycleLabel={activeCycle?.label} />}
                                    {currentView === 'finciclo' && <FormatFinCiclo students={students} cycleConfig={activeCycleConfig} configGlobal={schoolConfig} activeCycleLabel={activeCycle?.label} />}
                                    {currentView === 'usaer' && <FormatUSAER students={students} configGlobal={schoolConfig} cycleConfig={activeCycleConfig} activeCycleLabel={activeCycle?.label} />}
                                    {currentView === 'usaer_911_4' && <FormatUSAER_911_4 students={students} configGlobal={schoolConfig} cycleConfig={activeCycleConfig} activeCycleLabel={activeCycle?.label} />}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
